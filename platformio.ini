[platformio]
default_envs = yolo_uno

; ── 1. Môi trường Yolo:UNO (ESP32-S3) chuẩn phòng lab Bách Khoa ──
[env:yolo_uno]
platform = espressif32
board = yolo_uno
framework = arduino

upload_speed = 921600
monitor_speed = 115200

lib_deps =
    4-20ma/ModbusMaster@^2.0.1

lib_ignore =
    AsyncTCP_RP2040W
    ESPAsyncTCP
    RPAsyncTCP

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_build.filesystem = littlefs

; ── 2. Môi trường dự phòng cho ESP32 thường (esp32dev) ──
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

upload_speed = 921600
monitor_speed = 115200

lib_deps =
    4-20ma/ModbusMaster@^2.0.1

lib_ignore =
    AsyncTCP_RP2040W
    ESPAsyncTCP
    RPAsyncTCP

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384

board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_build.filesystem = littlefs
